services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - qdrant
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LANG=C.UTF-8
    restart: unless-stopped

volumes:
  qdrant_data: {}
